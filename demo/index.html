<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>on-codemerge Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        padding: 24px;
      }
      #editor {
        min-height: 280px;
      }
      #output {
        margin-top: 16px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 6px;
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 320px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>on-codemerge</h1>
      <p>Virtual document core — JSON is source of truth.</p>
      <div id="editor"></div>
      <h3>JSON</h3>
      <pre id="output"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
