<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>on-codemerge — demo stand</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --card: #fff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #0284c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
      }
      header p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 12px;
      }
      .meta span {
        background: #eef2ff;
        color: #3730a3;
        border-radius: 999px;
        padding: 4px 10px;
      }
      .modes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .modes button {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        font: inherit;
      }
      .modes button:hover {
        background: #fafafa;
      }
      .modes button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
      }
      /* Studio / dual-pane surfaces need a real height budget (h-full / flex-1). */
      #editor {
        display: flex;
        flex-direction: column;
        height: min(72vh, 720px);
        min-height: 480px;
      }
      #editor > .ocm-editor-root {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }
      #editor .ocm-editor,
      #editor .ocm-shell-content,
      #editor .ocm-table-root,
      #editor .ocm-content.ocm-md-root,
      #editor .ocm-studio {
        flex: 1 1 auto;
        min-height: 0;
      }
      /* Page chrome wants viewport height — don’t clamp it to the studio box. */
      #editor > .ocm-editor-root.ocm-editor-root--page {
        height: auto;
        min-height: min(70vh, 640px);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 0;
      }
      .actions[hidden] {
        display: none;
      }
      .actions button {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
      }
      .actions button:hover {
        background: #fafafa;
      }
      .actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      pre.out {
        margin: 0;
        padding: 12px;
        background: #fafafa;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
      }
      iframe#publish {
        width: 100%;
        min-height: 240px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }
      #publish-card[hidden] {
        display: none;
      }
      #errors {
        color: #b91c1c;
        font-size: 13px;
        white-space: pre-wrap;
      }
      #errors:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>on-codemerge demo stand</h1>
        <p>
          Smoke-tests package entry points:
          <code>on-codemerge</code>, <code>/json</code>, <code>/markdown</code>, <code>/code</code>,
          <code>/forms</code>, <code>/charts</code>, <code>/calendar</code>, <code>/tables</code> (+
          WYSIWYG <code>chrome: 'page'</code>).
        </p>
        <div class="meta">
          <span id="pkg-version">version: …</span>
          <span id="css-ok">css: …</span>
          <span id="exports-ok">exports: …</span>
          <span id="mode-label">mode: …</span>
        </div>
      </header>

      <div id="errors" class="card"></div>

      <div class="modes" role="tablist" aria-label="Editor mode">
        <button type="button" class="active" data-mode="wysiwyg" data-testid="mode-wysiwyg">
          WYSIWYG
        </button>
        <button type="button" data-mode="wysiwyg-page" data-testid="mode-wysiwyg-page">Page</button>
        <button type="button" data-mode="json" data-testid="mode-json">JSON</button>
        <button type="button" data-mode="markdown" data-testid="mode-markdown">Markdown</button>
        <button type="button" data-mode="code" data-testid="mode-code">Code</button>
        <button type="button" data-mode="forms" data-testid="mode-forms">Forms</button>
        <button type="button" data-mode="charts" data-testid="mode-charts">Charts</button>
        <button type="button" data-mode="calendar" data-testid="mode-calendar">Calendar</button>
        <button type="button" data-mode="tables" data-testid="mode-tables">Tables</button>
      </div>

      <div class="card">
        <div id="editor" data-testid="editor-host"></div>

        <div class="actions" data-actions="wysiwyg" data-testid="actions-wysiwyg">
          <button type="button" class="primary" id="btn-bold" data-testid="btn-bold">Bold</button>
          <button type="button" id="btn-json" data-testid="btn-json">Show JSON</button>
          <button type="button" id="btn-html" data-testid="btn-html">Show HTML</button>
          <button type="button" id="btn-md" data-testid="btn-md">Show Markdown</button>
          <button type="button" id="btn-publish" data-testid="btn-publish">
            Published preview
          </button>
          <button type="button" id="btn-set-html" data-testid="btn-set-html">
            Load sample HTML
          </button>
          <button type="button" id="btn-clear" data-testid="btn-clear">Clear</button>
        </div>

        <div class="actions" data-actions="json" data-testid="actions-json" hidden>
          <button type="button" class="primary" id="btn-json-text" data-testid="btn-json-text">
            Show text
          </button>
          <button type="button" id="btn-json-sample" data-testid="btn-json-sample">
            Load sample JSON
          </button>
          <button type="button" id="btn-clear-json" data-testid="btn-clear-json">
            Clear → null
          </button>
        </div>

        <div class="actions" data-actions="markdown" data-testid="actions-markdown" hidden>
          <button type="button" class="primary" id="btn-md-text" data-testid="btn-md-text">
            Show text
          </button>
          <button type="button" id="btn-md-html" data-testid="btn-md-html">Show HTML</button>
          <button type="button" id="btn-md-sample" data-testid="btn-md-sample">
            Load sample MD
          </button>
          <button type="button" id="btn-md-publish" data-testid="btn-md-publish">
            Published preview
          </button>
          <button type="button" id="btn-clear-md" data-testid="btn-clear-md">Clear</button>
        </div>

        <div class="actions" data-actions="code" data-testid="actions-code" hidden>
          <button type="button" class="primary" id="btn-code-text" data-testid="btn-code-text">
            Show text
          </button>
          <button type="button" id="btn-code-sample" data-testid="btn-code-sample">
            Load sample code
          </button>
          <button type="button" id="btn-clear-code" data-testid="btn-clear-code">Clear</button>
        </div>

        <div class="actions" data-actions="forms" data-testid="actions-forms" hidden>
          <button type="button" class="primary" id="btn-forms-text" data-testid="btn-forms-text">
            Show text
          </button>
          <button type="button" id="btn-forms-sample" data-testid="btn-forms-sample">
            Load sample form
          </button>
          <button type="button" id="btn-clear-forms" data-testid="btn-clear-forms">Clear</button>
        </div>

        <div class="actions" data-actions="charts" data-testid="actions-charts" hidden>
          <button type="button" class="primary" id="btn-charts-text" data-testid="btn-charts-text">
            Show text
          </button>
          <button type="button" id="btn-charts-sample" data-testid="btn-charts-sample">
            Load sample chart
          </button>
          <button type="button" id="btn-clear-charts" data-testid="btn-clear-charts">Clear</button>
        </div>

        <div class="actions" data-actions="calendar" data-testid="actions-calendar" hidden>
          <button
            type="button"
            class="primary"
            id="btn-calendar-text"
            data-testid="btn-calendar-text"
          >
            Show text
          </button>
          <button type="button" id="btn-calendar-sample" data-testid="btn-calendar-sample">
            Load sample calendar
          </button>
          <button type="button" id="btn-clear-calendar" data-testid="btn-clear-calendar">
            Clear
          </button>
        </div>

        <div class="actions" data-actions="tables" data-testid="actions-tables" hidden>
          <button type="button" class="primary" id="btn-tables-text" data-testid="btn-tables-text">
            Show text
          </button>
          <button type="button" id="btn-tables-sample" data-testid="btn-tables-sample">
            Load sample table
          </button>
          <button type="button" id="btn-clear-tables" data-testid="btn-clear-tables">Clear</button>
        </div>
      </div>

      <div class="card">
        <h3>Output</h3>
        <pre class="out" id="output" data-testid="output"></pre>
      </div>

      <div class="card" id="publish-card">
        <h3>Published document</h3>
        <iframe id="publish" data-testid="publish" title="Published preview"></iframe>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
