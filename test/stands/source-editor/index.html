<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Source editor stand</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .toolbar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
      }
      .panes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        background: #fff;
        overflow: hidden;
      }
      .pane h2 {
        margin: 0;
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid #e4e4e7;
        background: #f4f4f5;
        flex-shrink: 0;
      }
      .pane-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 1100px) {
        .panes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <button type="button" data-testid="btn-corpus">Load corpus</button>
        <button type="button" data-testid="btn-long">Load long + wide</button>
        <button type="button" data-testid="btn-huge">Load 12k lines</button>
        <button type="button" data-testid="btn-scroll-end">Scroll end</button>
        <button type="button" data-testid="btn-scroll-mid">Scroll mid</button>
        <span data-testid="status">idle</span>
      </div>
      <div class="panes">
        <section class="pane" data-testid="pane-isolated">
          <h2>Isolated mountSourceEditor</h2>
          <div class="pane-body" data-testid="host-isolated"></div>
        </section>
        <section class="pane" data-testid="pane-json">
          <h2>JSON Raw (JsonPlugin workspace)</h2>
          <div class="pane-body" data-testid="host-json"></div>
        </section>
        <section class="pane" data-testid="pane-md">
          <h2>Markdown source</h2>
          <div class="pane-body" data-testid="host-md"></div>
        </section>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
